[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clo-leveraged-loan-engine"
version = "0.1.0"
description = "Synthetic leveraged loan cash flows and an illustrative CLO waterfall"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = ["numpy>=1.24", "pandas>=2.0"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
